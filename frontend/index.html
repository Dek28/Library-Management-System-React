<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="University Library Management System" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23255ae8'/%3E%3Cpath d='M8 9h7a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2H8V9Zm16 0h-4.5a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2H24V9Z' fill='white'/%3E%3C/svg%3E" />
    <title>ULMS: University Library Management System</title>
    <script>
      // Resolve the theme before first paint so a dark-theme user never sees a
      // white flash. Kept inline and dependency-free for that reason.
      (function () {
        try {
          var saved = localStorage.getItem('ulms-theme');
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : system;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
